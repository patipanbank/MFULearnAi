---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mfulearnai-ingress
  namespace: mfulearnai
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/upstream-hash-by: $remote_addr
    nginx.ingress.kubernetes.io/websocket-services: chat-service
    # Enable CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://mfulearnai.mfu.ac.th"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
spec:
  tls:
  - hosts:
    - mfulearnai.mfu.ac.th
    secretName: mfulearnai-tls
  rules:
  - host: mfulearnai.mfu.ac.th
    http:
      paths:
      # Auth Service - Must be first for /api/auth routes
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 5001

      # Chat Service
      - path: /api/chat
        pathType: Prefix
        backend:
          service:
            name: chat-service
            port:
              number: 5002

      # WebSocket endpoint
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: chat-service
            port:
              number: 5002

      # Agent Service
      - path: /api/agents
        pathType: Prefix
        backend:
          service:
            name: agent-service
            port:
              number: 5003

      # Department Service
      - path: /api/departments
        pathType: Prefix
        backend:
          service:
            name: department-service
            port:
              number: 5002

      # RAG Service - Collections
      - path: /api/collections
        pathType: Prefix
        backend:
          service:
            name: rag-service
            port:
              number: 5004

      # RAG Service - Embeddings
      - path: /api/embeddings
        pathType: Prefix
        backend:
          service:
            name: rag-service
            port:
              number: 5004

      # RAG Service - Chroma
      - path: /api/chroma
        pathType: Prefix
        backend:
          service:
            name: rag-service
            port:
              number: 5004

      # Training Service
      - path: /api/training
        pathType: Prefix
        backend:
          service:
            name: training-service
            port:
              number: 5005

      # Training Service - Queue
      - path: /api/queue
        pathType: Prefix
        backend:
          service:
            name: training-service
            port:
              number: 5005

      # Storage Service - Upload
      - path: /api/upload
        pathType: Prefix
        backend:
          service:
            name: storage-service
            port:
              number: 5005

      # Storage Service - Files
      - path: /api/files
        pathType: Prefix
        backend:
          service:
            name: storage-service
            port:
              number: 5005

      # Usage/Analytics
      - path: /api/usage
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 5001

      # Frontend - Must be last (catch-all)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
