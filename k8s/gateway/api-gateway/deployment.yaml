---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: mfulearnai-gateway
data:
  NODE_ENV: "production"
  PORT: "8080"
  LOG_LEVEL: "info"
  CORS_ORIGIN: "https://mfulearnai.mfu.ac.th"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: mfulearnai-gateway
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: api-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: mfulearnai-gateway
  labels:
    app: api-gateway
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-gateway
        version: v1
    spec:
      containers:
      - name: api-gateway
        image: mfulearnai/api-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: api-gateway-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: api-gateway-config
              key: PORT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: api-gateway-config
              key: LOG_LEVEL
        - name: CORS_ORIGIN
          valueFrom:
            configMapKeyRef:
              name: api-gateway-config
              key: CORS_ORIGIN
        # Microservices URLs
        - name: AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: global-config
              key: AUTH_SERVICE_URL
        - name: DEPARTMENT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: global-config
              key: DEPARTMENT_SERVICE_URL
        - name: CHAT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: global-config
              key: CHAT_SERVICE_URL
        - name: AGENT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: global-config
              key: AGENT_SERVICE_URL
        - name: RAG_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: global-config
              key: RAG_SERVICE_URL
        - name: TRAINING_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: global-config
              key: TRAINING_SERVICE_URL
        - name: STORAGE_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: global-config
              key: STORAGE_SERVICE_URL
        # JWT Secret
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: jwt-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: mfulearnai-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
