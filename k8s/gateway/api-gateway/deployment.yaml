---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: mfulearnai-gateway
data:
  # Service endpoints
  AUTH_SERVICE_URL: "http://auth-service.mfulearnai-services.svc.cluster.local:3000"
  DEPARTMENT_SERVICE_URL: "http://department-service.mfulearnai-services.svc.cluster.local:3001"
  CHAT_SERVICE_URL: "http://chat-service.mfulearnai-services.svc.cluster.local:3002"
  AGENT_SERVICE_URL: "http://agent-service.mfulearnai-services.svc.cluster.local:3003"
  RAG_SERVICE_URL: "http://rag-service.mfulearnai-services.svc.cluster.local:3004"
  TRAINING_SERVICE_URL: "http://training-service.mfulearnai-services.svc.cluster.local:3005"
  STORAGE_SERVICE_URL: "http://storage-service.mfulearnai-services.svc.cluster.local:3006"
  BEDROCK_GATEWAY_URL: "http://bedrock-gateway.mfulearnai-services.svc.cluster.local:8000"

  # Gateway configuration
  PORT: "8080"
  LOG_LEVEL: "info"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "100"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: mfulearnai-gateway
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: api-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: mfulearnai-gateway
  labels:
    app: api-gateway
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-gateway
        version: v1
    spec:
      containers:
      - name: api-gateway
        image: mfulearnai/api-gateway:latest  # Update with your registry
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: api-gateway-config
        env:
        - name: REDIS_URL
          value: "redis://redis.mfulearnai-core.svc.cluster.local:6379"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: api-gateway-secret
              key: jwt-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: mfulearnai-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secret
  namespace: mfulearnai-gateway
type: Opaque
stringData:
  jwt-secret: changeme-jwt-secret-production  # Change this in production!
