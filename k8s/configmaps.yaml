# =====================================================
# MFULearnAI Kubernetes ConfigMaps
# =====================================================
# This file contains all non-sensitive configuration data
# =====================================================

---
# Global Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: global-config
  namespace: mfulearnai-services
data:
  # Environment
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"

  # Service URLs (internal cluster DNS)
  AUTH_SERVICE_URL: "http://auth-service.mfulearnai-services.svc.cluster.local:3000"
  DEPARTMENT_SERVICE_URL: "http://department-service.mfulearnai-services.svc.cluster.local:3001"
  CHAT_SERVICE_URL: "http://chat-service.mfulearnai-services.svc.cluster.local:3002"
  AGENT_SERVICE_URL: "http://agent-service.mfulearnai-services.svc.cluster.local:3003"
  RAG_SERVICE_URL: "http://rag-service.mfulearnai-services.svc.cluster.local:3004"
  TRAINING_SERVICE_URL: "http://training-service.mfulearnai-services.svc.cluster.local:3005"
  STORAGE_SERVICE_URL: "http://storage-service.mfulearnai-services.svc.cluster.local:3006"

  # Infrastructure URLs
  MONGODB_HOST: "mongodb.mfulearnai-core.svc.cluster.local"
  MONGODB_PORT: "27017"
  REDIS_HOST: "redis.mfulearnai-core.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_URL: "redis://redis.mfulearnai-core.svc.cluster.local:6379"
  CHROMADB_URL: "http://chromadb.mfulearnai-core.svc.cluster.local:8000"
  MINIO_ENDPOINT: "minio.mfulearnai-core.svc.cluster.local"
  MINIO_PORT: "9000"

  # Application Settings
  NODE_ENV: "production"
  TZ: "Asia/Bangkok"

---
# Frontend Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: mfulearnai-services
data:
  VITE_API_URL: "https://mfulearnai.mfu.ac.th/api"
  VITE_WS_URL: "wss://mfulearnai.mfu.ac.th/ws"

---
# NGINX Configuration for API Gateway (if using NGINX as sidecar)
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: mfulearnai-gateway
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 4096;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

        access_log /var/log/nginx/access.log main;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        client_max_body_size 50m;

        # Gzip Settings
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml text/javascript
                   application/json application/javascript application/xml+rss
                   application/rss+xml font/truetype font/opentype
                   application/vnd.ms-fontobject image/svg+xml;

        # Rate Limiting
        limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
        limit_conn_zone $binary_remote_addr zone=addr:10m;

        upstream api_backend {
            least_conn;
            server api-gateway:8080;
        }

        server {
            listen 80;
            server_name _;

            # Rate limiting
            limit_req zone=api_limit burst=200 nodelay;
            limit_conn addr 10;

            location / {
                proxy_pass http://api_backend;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 300s;
                proxy_connect_timeout 75s;
            }
        }
    }
