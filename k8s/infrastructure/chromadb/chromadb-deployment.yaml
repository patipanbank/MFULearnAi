---
apiVersion: v1
kind: Service
metadata:
  name: chromadb
  namespace: mfulearnai-core
  labels:
    app: chromadb
spec:
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  selector:
    app: chromadb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chromadb
  namespace: mfulearnai-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chromadb
  template:
    metadata:
      labels:
        app: chromadb
    spec:
      containers:
      - name: chromadb
        image: chromadb/chroma:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: ANONYMIZED_TELEMETRY
          value: "False"
        - name: CHROMA_SERVER_CORS_ALLOW_ORIGINS
          value: '["*"]'
        - name: PERSIST_DIRECTORY
          value: /chroma/chroma
        volumeMounts:
        - name: chromadb-data
          mountPath: /chroma/chroma
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /api/v1/heartbeat
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/heartbeat
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: chromadb-data
        persistentVolumeClaim:
          claimName: chromadb-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chromadb-pvc
  namespace: mfulearnai-core
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
