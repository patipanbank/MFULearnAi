# =====================================================
# MFULearnAI Kubernetes Secrets Template
# =====================================================
# IMPORTANT: This is a template file. DO NOT commit actual secrets to Git!
#
# Usage:
# 1. Copy this file: cp secrets-template.yaml secrets.yaml
# 2. Fill in actual values in secrets.yaml
# 3. Apply: kubectl apply -f secrets.yaml
# 4. Add secrets.yaml to .gitignore
# =====================================================

---
# MongoDB Secrets
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: mfulearnai-core
type: Opaque
stringData:
  username: root
  password: CHANGE_ME_MONGODB_PASSWORD  # Change this!
  mongodb-uri: mongodb://root:CHANGE_ME_MONGODB_PASSWORD@mongodb.mfulearnai-core.svc.cluster.local:27017/mfu_chatbot?authSource=admin

---
# MinIO Secrets
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: mfulearnai-core
type: Opaque
stringData:
  root-user: minioadmin
  root-password: CHANGE_ME_MINIO_PASSWORD  # Change this!
  endpoint: http://minio.mfulearnai-core.svc.cluster.local:9000

---
# Auth Service Secrets
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: mfulearnai-services
type: Opaque
stringData:
  session-secret: CHANGE_ME_SESSION_SECRET_MIN_32_CHARS  # Change this! Min 32 chars
  jwt-secret: CHANGE_ME_JWT_SECRET_MIN_32_CHARS  # Change this! Min 32 chars
  # SAML Configuration (if needed)
  saml-cert: ""
  saml-key: ""

---
# API Gateway Secrets
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secret
  namespace: mfulearnai-gateway
type: Opaque
stringData:
  jwt-secret: CHANGE_ME_JWT_SECRET_MIN_32_CHARS  # Same as auth-service JWT secret

---
# Grafana Secrets
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: mfulearnai-monitoring
type: Opaque
stringData:
  admin-user: admin
  admin-password: CHANGE_ME_GRAFANA_PASSWORD  # Change this!

---
# TLS Certificate Secret (if using cert-manager, this will be auto-generated)
# Otherwise, create manually with:
# kubectl create secret tls mfulearnai-tls \
#   --cert=path/to/cert.pem \
#   --key=path/to/key.pem \
#   -n mfulearnai-gateway
apiVersion: v1
kind: Secret
metadata:
  name: mfulearnai-tls
  namespace: mfulearnai-gateway
type: kubernetes.io/tls
data:
  # Base64 encoded certificate and key
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t...  # Add your base64 encoded cert
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t...  # Add your base64 encoded key

---
# AWS Credentials for Bedrock (if needed)
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: mfulearnai-services
type: Opaque
stringData:
  aws-access-key-id: CHANGE_ME_AWS_ACCESS_KEY
  aws-secret-access-key: CHANGE_ME_AWS_SECRET_KEY
  aws-region: us-east-1
