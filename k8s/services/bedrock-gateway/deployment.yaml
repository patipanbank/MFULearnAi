---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bedrock-gateway-config
  namespace: mfulearnai-services
data:
  PYTHON_ENV: "production"
  PORT: "8000"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: Service
metadata:
  name: bedrock-gateway
  namespace: mfulearnai-services
  labels:
    app: bedrock-gateway
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: bedrock-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bedrock-gateway
  namespace: mfulearnai-services
  labels:
    app: bedrock-gateway
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bedrock-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: bedrock-gateway
        version: v1
    spec:
      containers:
      - name: bedrock-gateway
        image: mfulearnai/bedrock-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: PYTHON_ENV
          valueFrom:
            configMapKeyRef:
              name: bedrock-gateway-config
              key: PYTHON_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: bedrock-gateway-config
              key: PORT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: bedrock-gateway-config
              key: LOG_LEVEL
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: mongodb-uri
        - name: AWS_REGION
          valueFrom:
            secretKeyRef:
              name: aws-secret
              key: aws-region
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws-secret
              key: aws-access-key-id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws-secret
              key: aws-secret-access-key
        - name: AWS_BEDROCK_MODEL_ID
          valueFrom:
            secretKeyRef:
              name: bedrock-gateway-secret
              key: aws-bedrock-model-id
        resources:
          requests:
            memory: "512Mi"
            cpu: "300m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bedrock-gateway-hpa
  namespace: mfulearnai-services
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bedrock-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
