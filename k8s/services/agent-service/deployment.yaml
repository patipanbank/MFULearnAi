---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-service-config
  namespace: mfulearnai-services
data:
  NODE_ENV: "production"
  PORT: "3003"
  LOG_LEVEL: "info"
  RAG_SERVICE_URL: "http://rag-service.mfulearnai-services.svc.cluster.local:3004"
  STORAGE_SERVICE_URL: "http://storage-service.mfulearnai-services.svc.cluster.local:3006"
---
apiVersion: v1
kind: Service
metadata:
  name: agent-service
  namespace: mfulearnai-services
  labels:
    app: agent-service
spec:
  type: ClusterIP
  ports:
  - port: 3003
    targetPort: 3003
    protocol: TCP
    name: http
  selector:
    app: agent-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  namespace: mfulearnai-services
  labels:
    app: agent-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: agent-service
        version: v1
    spec:
      containers:
      - name: agent-service
        image: mfulearnai/agent-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3003
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: agent-service-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: agent-service-config
              key: PORT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: agent-service-config
              key: LOG_LEVEL
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: mongodb-uri
        - name: RAG_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: agent-service-config
              key: RAG_SERVICE_URL
        - name: STORAGE_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: agent-service-config
              key: STORAGE_SERVICE_URL
        - name: AWS_REGION
          valueFrom:
            secretKeyRef:
              name: aws-secret
              key: aws-region
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws-secret
              key: aws-access-key-id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws-secret
              key: aws-secret-access-key
        resources:
          requests:
            memory: "512Mi"
            cpu: "300m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 3003
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-service-hpa
  namespace: mfulearnai-services
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
