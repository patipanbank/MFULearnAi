---
apiVersion: v1
kind: ConfigMap
metadata:
  name: storage-service-config
  namespace: mfulearnai-services
data:
  NODE_ENV: "production"
  PORT: "3006"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: Service
metadata:
  name: storage-service
  namespace: mfulearnai-services
  labels:
    app: storage-service
spec:
  type: ClusterIP
  ports:
  - port: 3006
    targetPort: 3006
    protocol: TCP
    name: http
  selector:
    app: storage-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-service
  namespace: mfulearnai-services
  labels:
    app: storage-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storage-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: storage-service
        version: v1
    spec:
      containers:
      - name: storage-service
        image: mfulearnai/storage-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3006
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: storage-service-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: storage-service-config
              key: PORT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: storage-service-config
              key: LOG_LEVEL
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: mongodb-uri
        - name: S3_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: storage-service-secret
              key: s3-endpoint
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: storage-service-secret
              key: s3-access-key
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: storage-service-secret
              key: s3-secret-key
        - name: S3_BUCKET
          valueFrom:
            secretKeyRef:
              name: storage-service-secret
              key: s3-bucket
        - name: S3_PUBLIC_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: storage-service-secret
              key: s3-public-endpoint
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3006
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 3006
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 3006
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: storage-service-hpa
  namespace: mfulearnai-services
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: storage-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
