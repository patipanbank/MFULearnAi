---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-service-config
  namespace: mfulearnai-services
data:
  NODE_ENV: "production"
  PORT: "3004"
  LOG_LEVEL: "info"
  CHROMA_URL: "http://chromadb.mfulearnai-core.svc.cluster.local:8000"
  BEDROCK_SERVICE_URL: "http://bedrock-gateway.mfulearnai-services.svc.cluster.local:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: rag-service
  namespace: mfulearnai-services
  labels:
    app: rag-service
spec:
  type: ClusterIP
  ports:
  - port: 3004
    targetPort: 3004
    protocol: TCP
    name: http
  selector:
    app: rag-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
  namespace: mfulearnai-services
  labels:
    app: rag-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: rag-service
        version: v1
    spec:
      containers:
      - name: rag-service
        image: mfulearnai/rag-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3004
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: rag-service-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: rag-service-config
              key: PORT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: rag-service-config
              key: LOG_LEVEL
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: mongodb-uri
        - name: CHROMA_URL
          valueFrom:
            configMapKeyRef:
              name: rag-service-config
              key: CHROMA_URL
        - name: BEDROCK_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: rag-service-config
              key: BEDROCK_SERVICE_URL
        resources:
          requests:
            memory: "512Mi"
            cpu: "300m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3004
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 3004
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 3004
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rag-service-hpa
  namespace: mfulearnai-services
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rag-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
