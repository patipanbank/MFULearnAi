---
apiVersion: v1
kind: ConfigMap
metadata:
  name: department-service-config
  namespace: mfulearnai-services
data:
  NODE_ENV: "production"
  PORT: "3001"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: Service
metadata:
  name: department-service
  namespace: mfulearnai-services
  labels:
    app: department-service
spec:
  type: ClusterIP
  ports:
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: http
  selector:
    app: department-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: department-service
  namespace: mfulearnai-services
  labels:
    app: department-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: department-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: department-service
        version: v1
    spec:
      containers:
      - name: department-service
        image: mfulearnai/department-service:latest  # Update with your registry
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: department-service-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: department-service-config
              key: PORT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: department-service-config
              key: LOG_LEVEL
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: mongodb-uri
        - name: REDIS_URL
          value: "redis://redis.mfulearnai-core.svc.cluster.local:6379"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: department-service-hpa
  namespace: mfulearnai-services
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: department-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
