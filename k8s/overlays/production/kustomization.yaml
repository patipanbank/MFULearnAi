apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mfulearnai-prod

bases:
  - ../../

commonLabels:
  environment: production

# Patches for production
patchesStrategicMerge:
  - replica-patch.yaml
  - resource-patch.yaml
  - security-patch.yaml

# ConfigMap generator for production
configMapGenerator:
  - name: env-config
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - DEBUG=false

# Name suffix for all resources
nameSuffix: -prod

# Images with production tags
images:
  - name: mfulearnai/auth-service
    newTag: v1.0.0  # Use specific version tags in production
  - name: mfulearnai/department-service
    newTag: v1.0.0
  - name: mfulearnai/api-gateway
    newTag: v1.0.0
