---
# Reduce resources for development
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: mfulearnai-services
spec:
  template:
    spec:
      containers:
      - name: auth-service
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: department-service
  namespace: mfulearnai-services
spec:
  template:
    spec:
      containers:
      - name: department-service
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
