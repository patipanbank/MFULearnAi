apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: mfulearnai
  labels:
    app: auth-service
    tier: backend
    component: authentication
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        tier: backend
        component: authentication
    spec:
      containers:
      - name: auth-service
        image: mfulearnai/auth-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
          name: http
          protocol: TCP
        env:
        - name: PORT
          value: "3001"
        - name: APP_ENV
          value: "production"
        - name: LOG_LEVEL
          value: "info"
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: auth-service-secrets
              key: mongodb-uri
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: auth-service-secrets
              key: jwt-secret
        - name: JWT_ALGORITHM
          valueFrom:
            configMapKeyRef:
              name: auth-service-config
              key: jwt-algorithm
        - name: ACCESS_TOKEN_EXPIRE_MINUTES
          valueFrom:
            configMapKeyRef:
              name: auth-service-config
              key: access-token-expire-minutes
        - name: PROD_FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: auth-service-config
              key: frontend-url
        - name: PROD_ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: auth-service-config
              key: allowed-origins
        - name: SAML_SP_ENTITY_ID
          valueFrom:
            configMapKeyRef:
              name: auth-service-config
              key: saml-sp-entity-id
        - name: SAML_SP_ACS_URL
          valueFrom:
            configMapKeyRef:
              name: auth-service-config
              key: saml-sp-acs-url
        - name: SAML_IDP_SSO_URL
          valueFrom:
            secretKeyRef:
              name: auth-service-secrets
              key: saml-idp-sso-url
        - name: SAML_IDP_SLO_URL
          valueFrom:
            secretKeyRef:
              name: auth-service-secrets
              key: saml-idp-slo-url
        - name: SAML_IDP_ENTITY_ID
          valueFrom:
            secretKeyRef:
              name: auth-service-secrets
              key: saml-idp-entity-id
        - name: SAML_CERTIFICATE
          valueFrom:
            secretKeyRef:
              name: auth-service-secrets
              key: saml-certificate
        - name: SAML_IDENTIFIER_FORMAT
          valueFrom:
            configMapKeyRef:
              name: auth-service-config
              key: saml-identifier-format
        - name: DEPARTMENT_SERVICE_URL
          value: "http://department-service:3002"
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: auth-service-secrets
              key: session-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: mfulearnai
  labels:
    app: auth-service
spec:
  type: NodePort
  selector:
    app: auth-service
  ports:
  - name: http
    port: 3001
    targetPort: 3001
    nodePort: 30001
    protocol: TCP
  sessionAffinity: None
