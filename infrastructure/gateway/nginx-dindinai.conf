events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # Logging (less verbose for production)
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    
    # Strict rate limiting for PRODUCTION
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_req_status 429;

    # Gzip compression
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1000;

    upstream auth_service {
        server auth-service:4000;
        keepalive 64;
    }

    upstream orchestrator_service {
        server orchestrator-service:8080;
        keepalive 64;
    }

    upstream frontend_service {
        server frontend-service:80;
    }

    server {
        listen 80;
        server_name dindin.mfu.ac.th dindinai.mfu.ac.th;
        
        # Redirect HTTP to HTTPS in production
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name dindin.mfu.ac.th dindinai.mfu.ac.th;
        
        # SSL Configuration (managed externally)
        ssl_certificate /etc/nginx/ssl/dindin.crt;
        ssl_certificate_key /etc/nginx/ssl/dindin.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        
        client_max_body_size 50M;
        
        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://dindin.mfu.ac.th wss://dindin.mfu.ac.th" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Environment "PROD" always;
        
        # Hide server info
        server_tokens off;

        # Health Check
        location /health {
            return 200 '{"status":"ok","gateway":"nginx","environment":"PROD"}';
            add_header Content-Type application/json;
        }

        # Auth Routes
        location /api/auth {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }

        # Chat Routes (with SSE support)
        location /api/chat {
            limit_req zone=api_limit burst=30 nodelay;
            limit_conn conn_limit 10;
            
            proxy_pass http://orchestrator_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # SSE Support
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 180s;  # 3 min
            proxy_connect_timeout 10s;
        }

        # Tool Access Management
        location /api/tools {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://orchestrator_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Block direct access to internal services
        location /api/bedrock {
            return 403;
        }

        location /api/logs {
            # Admin only - require additional auth
            return 403;
        }

        # Frontend UI
        location / {
            proxy_pass http://frontend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_http_version 1.1;
            proxy_cache_valid 200 1h;
        }

        # Error pages
        error_page 429 /rate_limit.html;
        error_page 500 502 503 504 /error.html;
        
        location = /rate_limit.html {
            internal;
            return 429 '{"error":"Too many requests. Please try again later."}';
            add_header Content-Type application/json;
        }
        
        location = /error.html {
            internal;
            return 500 '{"error":"Service temporarily unavailable."}';
            add_header Content-Type application/json;
        }
    }
}
