events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log debug;  # Debug level for TEST
    
    # Relaxed rate limiting for TEST environment
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    upstream identity_service {
        server identity-service:4001;
        keepalive 32;
    }

    upstream sso_service {
        server sso-service:4002;
        keepalive 32;
    }

    upstream oauth_service {
        server oauth-service:4003;
        keepalive 32;
    }

    upstream orchestrator_service {
        server orchestrator-service:8080;
        keepalive 32;
    }

    upstream bedrock_text {
        server bedrock-text:5001;
        keepalive 32;
    }

    upstream bedrock_image {
        server bedrock-image:5002;
        keepalive 32;
    }

    upstream bedrock_embedding {
        server bedrock-embedding:5003;
        keepalive 32;
    }

    upstream logger_service {
        server logger-service:6000;
        keepalive 32;
    }

    upstream frontend_service {
        server frontend-service:80;
    }

    upstream knowledge_service {
        server knowledge-service:7000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name mfulearnai.mfu.ac.th localhost;
        
        client_max_body_size 100M;
        
        # Debug headers for TEST environment
        add_header X-Environment "TEST" always;
        add_header X-Service-Name "MFULearnAI-Gateway" always;

        # Health Check
        location /health {
            return 200 '{"status":"ok","gateway":"nginx","environment":"TEST"}';
            add_header Content-Type application/json;
        }

        # SSO Routes (SAML)
        location /api/auth/login/saml {
            proxy_pass http://sso_service;
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }
        location /api/auth/saml/callback {
            proxy_pass http://sso_service;
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }

        location /api/auth/logout {
            proxy_pass http://sso_service;
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }

        # OAuth Routes (Google)
        location /api/auth/login/google {
            proxy_pass http://oauth_service;
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }
        location /api/auth/google/callback {
            proxy_pass http://oauth_service;
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }

        # MFU SSO Exchange
        location /api/auth/mfu/exchange {
            proxy_pass http://oauth_service;
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }

        # Identity Routes (Default /api/auth)
        location /api/auth {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://identity_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /api/departments {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://identity_service;
            proxy_set_header Host $host;
            # Standard Proxy Headers
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /api/users {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://identity_service;
            proxy_set_header Host $host;
            # Standard Proxy Headers
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /api/prompts {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://orchestrator_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # Chat Routes (with SSE support)
        location /api/chat {
            limit_req zone=api_limit burst=100 nodelay;
            limit_conn conn_limit 20;
            
            proxy_pass http://orchestrator_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # SSE Support
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;  # 5 min for long responses
        }

        # Bedrock Routes (Split)
        location /api/bedrock/chat {
            proxy_pass http://bedrock_text;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location /api/bedrock/models {
            proxy_pass http://bedrock_text;
            proxy_read_timeout 60s;
        }

        location /api/bedrock/image {
            proxy_pass http://bedrock_image;
            proxy_read_timeout 60s;
        }

        location /api/bedrock/embeddings {
            proxy_pass http://bedrock_embedding;
            proxy_read_timeout 60s;
        }

        # Logger Routes (admin)
        location /api/logs {
            proxy_pass http://logger_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Knowledge Base Routes
        location /api/knowledge {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://knowledge_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            client_max_body_size 50M; # Allow large PDF uploads
        }

        # Frontend UI
        location / {
            proxy_pass http://frontend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_http_version 1.1;
        }
    }
}
