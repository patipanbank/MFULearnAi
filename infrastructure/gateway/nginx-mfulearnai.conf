events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log debug;  # Debug level for TEST
    
    # Phase 3: Observability - Correlation ID
    # Use standard Nginx request_id if header not present
    map $http_x_correlation_id $correlation_id {
        default $http_x_correlation_id;
        ""      $request_id;
    }
    
    # Relaxed rate limiting for TEST environment
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    upstream identity_service {
        server backend-service:8080;
        keepalive 32;
    }

    upstream sso_service {
        server backend-service:8080;
        keepalive 32;
    }

    upstream oauth_service {
        server backend-service:8080;
        keepalive 32;
    }

    upstream backend_service {
        server backend-service:8080;
        keepalive 32;
    }

    # Bedrock upstreams removed (internal)

    upstream logger_service {
        server backend-service:8080;
        keepalive 32;
    }

    upstream frontend_service {
        server frontend-service:80;
    }

    upstream knowledge_service {
        server backend-service:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name mfulearnai.mfu.ac.th localhost;
        
        client_max_body_size 100M;
        
        # Debug headers for TEST environment
        add_header X-Environment "TEST" always;
        add_header X-Service-Name "MFULearnAI-Gateway" always;

        # SECURITY: Block Public Bedrock Access (Priority)
        location ^~ /api/bedrock {
            return 404;
        }

        # Health Check
        location /health {
            return 200 '{"status":"ok","gateway":"nginx","environment":"TEST"}';
            add_header Content-Type application/json;
        }

        # SSO Routes (SAML)
        location /auth/login/saml {
            proxy_pass http://sso_service;
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }
        location /auth/saml/callback {
            proxy_pass http://sso_service;
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }

        location /auth/logout {
            proxy_pass http://sso_service;
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }

        # OAuth Routes (MFU SSO)
        location /auth/login/sso {
            proxy_pass http://oauth_service;
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }
        
        location /auth/sso/callback {
            proxy_pass http://oauth_service;
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }

        # Legacy Google Routes (Optional: Keep or Redirect)
        location /auth/login/google {
             proxy_pass http://oauth_service;
             proxy_set_header Host $host;
        }

        # Identity Routes (Default /auth)
        location = /auth/callback {
            proxy_pass http://frontend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_http_version 1.1;
        }

        location /auth {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://identity_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_read_timeout 60s;
        }

        location /api/departments {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://identity_service;
            proxy_set_header Host $host;
            # Standard Proxy Headers
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_read_timeout 60s;
        }

        location /api/users {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://identity_service;
            proxy_set_header Host $host;
            # Standard Proxy Headers
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_read_timeout 60s;
        }

        location /api/prompts {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://backend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # Socket.IO WebSocket Support
        location /socket.io {
            proxy_pass http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;  # 24h for persistent WS
            
            # Disable buffering for real-time events
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection "upgrade";
        }

        # Chat Routes (Standard JSON API)
        location /api/chat {
            limit_req zone=api_limit burst=100 nodelay;
            limit_conn conn_limit 20;
            
            proxy_pass http://backend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        # Bedrock Routes (REMOVED - Internal Use Only)

        
        # Knowledge Base Routes
        location /api/knowledge {
            limit_req zone=api_limit burst=20 nodelay;
            
            # Security: Strip trust headers to prevent spoofing
            proxy_set_header x-user-id "";
            proxy_set_header x-role "";
            proxy_set_header x-department "";
            proxy_set_header x-internal-key "";
            
            proxy_pass http://knowledge_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            client_max_body_size 100M; 
        }

        # Logger Routes (admin)
        location /api/logs {
            proxy_pass http://logger_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Frontend UI
        location / {
            proxy_pass http://frontend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_http_version 1.1;
        }
    }
}
