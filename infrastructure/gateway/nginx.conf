events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # Correlation ID Logic (Immutable)
    map $http_x_correlation_id $correlation_id {
        default $http_x_correlation_id;
        ""      $request_id;
    }

    # Rate Limit Zones (Distinct Buckets)
    limit_req_zone $binary_remote_addr zone=public_read:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=public_write:10m rate=5r/s;

    client_max_body_size 100M;

    upstream auth_service {
        server auth-service:4000;
    }

    upstream orchestrator_service {
        server orchestrator-service:8080;
    }

    upstream knowledge_service {
        server knowledge-service:7000;
    }

    upstream frontend_service {
        server frontend-service:80;
    }

    server {
        listen 80;
        add_header X-Service-Name "Gateway-Nginx";
        
        # Security: Hide Nginx Version
        server_tokens off;

        # Health Check
        location /health {
            return 200 '{"status":"ok", "gateway":"nginx"}';
            add_header Content-Type application/json;
        }

        # Auth Routes
        location /api/auth {
            limit_req zone=public_read burst=10 nodelay;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Security: Strip Trust Headers
            proxy_set_header x-user-id "";
            proxy_set_header x-role "";
            proxy_set_header x-department "";
            proxy_set_header x-internal-key "";
            
            # Traceability
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        # Chat Routes
        location /api/chat {
            limit_req zone=public_write burst=20 nodelay; # Chat involves writing/generation
            proxy_pass http://orchestrator_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # SSE Support
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
            
            # Security: Strip Trust Headers
            proxy_set_header x-user-id "";
            proxy_set_header x-role "";
            proxy_set_header x-department "";
            proxy_set_header x-internal-key "";

            # Traceability
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        # Knowledge Routes
        location /api/knowledge {
            limit_req zone=public_write burst=10 nodelay; # Uploads are heavy
            proxy_pass http://knowledge_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            client_max_body_size 100M;
            
            # Security: Strip Trust Headers
            proxy_set_header x-user-id "";
            proxy_set_header x-role "";
            proxy_set_header x-department "";
            proxy_set_header x-internal-key "";

            # Traceability
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        # Frontend UI
        location / {
            limit_req zone=public_read burst=50 nodelay;
            proxy_pass http://frontend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
