events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # Simple rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    
    client_max_body_size 100M;   # Increase upload limit (Global)

    upstream auth_service {
        server auth-service:4000;
    }

    upstream orchestrator_service {
        server orchestrator-service:8080;
    }

    upstream knowledge_service {
        server knowledge-service:7000;
    }

    upstream frontend_service {
        server frontend-service:80;
    }

    server {
        listen 80;
        add_header X-Service-Name "Gateway-Nginx";

        
        # Health Check
        location /health {
            return 200 '{"status":"ok", "gateway":"nginx"}';
            add_header Content-Type application/json;
        }

        # Auth Routes
        location /api/auth {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Chat Routes
        location /api/chat {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://orchestrator_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # SSE Support
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
        }

        # Knowledge Routes
        location /api/knowledge {
            proxy_pass http://knowledge_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            client_max_body_size 100M; # Ensure limit applies here specifically too
        }

        # Frontend UI
        location / {
            proxy_pass http://frontend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
