version: '3.8'

services:
  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ../gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - orchestrator-service

  auth-service:
    build:
      context: ../../
      dockerfile: services/auth/Dockerfile
    environment:
      - PORT=4000
      - MONGO_URI=mongodb://mongo:27017/mful-auth
      - JWT_SECRET=test-secret
      - SAML_SP_ENTITY_ID=mfu-learn-ai
      - SAML_IDP_SSO_URL=https://idp.example.com/sso
    depends_on:
      - mongo

  orchestrator-service:
    build:
      context: ../../
      dockerfile: services/orchestrator/Dockerfile
    environment:
      - PORT=8080
      - BEDROCK_URL=http://bedrock-service:5000/api/bedrock
      - LOGGER_URL=http://logger-service:6000/api/logs
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=test-secret
      - ENV_TYPE=TEST
    depends_on:
      - redis
      - bedrock-service
      - logger-service

  bedrock-service:
    build:
      context: ../../
      dockerfile: services/bedrock/Dockerfile
    environment:
      - PORT=5000
      - AWS_Region=ap-southeast-1
      - ENV_TYPE=TEST
      # AWS Credentials should be passed via env file or instance role normally
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}

  logger-service:
    build:
      context: ../../
      dockerfile: services/logger/Dockerfile
    environment:
      - PORT=6000
      - MONGO_URI=mongodb://mongo:27017/mful-logs

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data-test:/data/db

volumes:
  mongo-data-test:
