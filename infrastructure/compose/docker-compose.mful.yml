version: '3.8'

# MFULearnAI - TEST/STAGING Environment
# Purpose: Experimentation, testing, model evaluation

services:
  gateway:
    image: nginx:alpine
    container_name: mfulearnai-gateway
    ports:
      - "8080:80"
    volumes:
      - ../gateway/nginx-mfulearnai.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - orchestrator-service
      - frontend-service
    networks:
      - mfulearnai-network
    restart: unless-stopped

  auth-service:
    build:
      context: ../../
      dockerfile: services/auth/Dockerfile
    container_name: mfulearnai-auth
    environment:
      - PORT=4000
      - ENV_TYPE=TEST
      - MONGO_URI=mongodb://mongo:27017/mfulearnai-auth
      - JWT_SECRET=${JWT_SECRET:-test-jwt-secret-change-me}
      - LOGGER_URL=http://logger-service:6000/api/logs
      - FRONTEND_URL=https://mfulearnai.mfu.ac.th
      # SAML Config (MFU SSO)
      - SAML_SP_ENTITY_ID=mfu-learn-ai-test
      - SAML_SP_ACS_URL=https://mfulearnai.mfu.ac.th/api/auth/saml/callback
      - SAML_IDP_SSO_URL=${SAML_IDP_SSO_URL}
      - SAML_IDP_SLO_URL=${SAML_IDP_SLO_URL}
      - SAML_CERTIFICATE=${SAML_CERTIFICATE}
      # Google OAuth (Optional fallback)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=https://mfulearnai.mfu.ac.th/api/auth/google/callback
    depends_on:
      - mongo
    networks:
      - mfulearnai-network
    restart: unless-stopped

  orchestrator-service:
    build:
      context: ../../
      dockerfile: services/orchestrator/Dockerfile
    container_name: mfulearnai-orchestrator
    environment:
      - PORT=8080
      - ENV_TYPE=TEST
      - BEDROCK_URL=http://bedrock-service:5000/api/bedrock
      - LOGGER_URL=http://logger-service:6000/api/logs
      - MONGO_URI=mongodb://mongo:27017/mfulearnai-chat
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-test-jwt-secret-change-me}
    depends_on:
      - redis
      - mongo
      - bedrock-service
      - logger-service
    networks:
      - mfulearnai-network
    restart: unless-stopped

  bedrock-service:
    build:
      context: ../../
      dockerfile: services/bedrock/Dockerfile
    container_name: mfulearnai-bedrock
    environment:
      - PORT=5000
      - ENV_TYPE=TEST
      - AWS_REGION=${AWS_REGION:-ap-southeast-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    networks:
      - mfulearnai-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  logger-service:
    build:
      context: ../../
      dockerfile: services/logger/Dockerfile
    container_name: mfulearnai-logger
    environment:
      - PORT=6000
      - ENV_TYPE=TEST
      - MONGO_URI=mongodb://mongo:27017/mfulearnai-logs
    depends_on:
      - mongo
    networks:
      - mfulearnai-network
    restart: unless-stopped

  frontend-service:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: mfulearnai-frontend
    environment:
      - VITE_API_URL=/api
      - VITE_ENV=test
    networks:
      - mfulearnai-network
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: mfulearnai-redis
    ports:
      - "6379:6379"
    volumes:
      - mfulearnai-redis-data:/data
    networks:
      - mfulearnai-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  mongo:
    image: mongo:6
    container_name: mfulearnai-mongo
    ports:
      - "27017:27017"
    volumes:
      - mfulearnai-mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=mfulearnai
    networks:
      - mfulearnai-network
    restart: unless-stopped

volumes:
  mfulearnai-redis-data:
  mfulearnai-mongo-data:

networks:
  mfulearnai-network:
    driver: bridge
