version: '3.8'

# MFULearnAI - TEST/STAGING Environment
# Purpose: Experimentation, testing, model evaluation

services:
  gateway:
    image: nginx:alpine
    container_name: mfulearnai-gateway
    ports:
      - "80:80"
    volumes:
      - ../gateway/nginx-mfulearnai.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - identity-service
      - sso-service
      - oauth-service
      - orchestrator-service
      - frontend-service
    networks:
      - mfulearnai-network
    restart: unless-stopped

  identity-service:
    build:
      context: ../../services/identity
      dockerfile: Dockerfile
    container_name: mfulearnai-identity
    environment:
      - PORT=4001
      - ENV_TYPE=TEST
      - MONGO_URI=mongodb://mongo:27017/mfulearnai-auth
      - JWT_SECRET=${JWT_SECRET:-test-jwt-secret-change-me}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-internal-secret-key}
    depends_on:
      - mongo
    networks:
      - mfulearnai-network
    restart: unless-stopped

  sso-service:
    build:
      context: ../../services/sso
      dockerfile: Dockerfile
    container_name: mfulearnai-sso
    environment:
      - PORT=4002
      - IDENTITY_SERVICE_URL=http://identity-service:4001
      - FRONTEND_URL=https://mfulearnai.mfu.ac.th
      - API_GATEWAY_URL=${API_GATEWAY_URL:-https://mfulearnai.mfu.ac.th}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-internal-secret-key}
      # SAML Config
      - SAML_SP_ENTITY_ID=https://mfulearnai.mfu.ac.th
      - SAML_SP_ACS_URL=https://mfulearnai.mfu.ac.th/api/auth/saml/callback
      - SAML_IDP_SSO_URL=${SAML_IDP_SSO_URL:-https://authsso.mfu.ac.th/adfs/ls/}
      - SAML_IDP_SLO_URL=${SAML_IDP_SLO_URL:-https://authsso.mfu.ac.th/adfs/ls/?wa=wsignout1.0}
      - SAML_CERTIFICATE=${SAML_CERTIFICATE}
    depends_on:
      - identity-service
    networks:
      - mfulearnai-network
    restart: unless-stopped

  oauth-service:
    build:
      context: ../../services/oauth
      dockerfile: Dockerfile
    container_name: mfulearnai-oauth
    environment:
      - PORT=4003
      - IDENTITY_SERVICE_URL=http://identity-service:4001
      - FRONTEND_URL=https://mfulearnai.mfu.ac.th
      - API_GATEWAY_URL=${API_GATEWAY_URL:-https://mfulearnai.mfu.ac.th}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-internal-secret-key}
      # Google Config
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=https://mfulearnai.mfu.ac.th/api/auth/google/callback
    depends_on:
      - identity-service
    networks:
      - mfulearnai-network
    restart: unless-stopped

  orchestrator-service:
    build:
      context: ../../
      dockerfile: services/orchestrator/Dockerfile
    container_name: mfulearnai-orchestrator
    environment:
      - PORT=8080
      - ENV_TYPE=TEST
      - BEDROCK_TEXT_URL=http://bedrock-text:5001/api/bedrock
      - LOGGER_URL=http://logger-service:6000/api/logs
      - MONGO_URI=mongodb://mongo:27017/mfulearnai-chat
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-test-jwt-secret-change-me}
      - KNOWLEDGE_URL=http://knowledge-service:7000/api/knowledge

    depends_on:
      - redis
      - mongo
      - bedrock-text
      - logger-service

    networks:
      - mfulearnai-network
    restart: unless-stopped

  # --- Bedrock Microservices ---
  bedrock-text:
    build:
      context: ../../services/bedrock-text
      dockerfile: Dockerfile
    container_name: bedrock-text
    environment:
      - PORT=5001
      - ENV_TYPE=TEST
      - AWS_REGION=${AWS_REGION:-ap-southeast-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    ports:
      - "5001:5001"
    networks:
      - mfulearnai-network
    restart: unless-stopped

  bedrock-image:
    build:
      context: ../../services/bedrock-image
      dockerfile: Dockerfile
    container_name: bedrock-image
    environment:
      - PORT=5002
      - AWS_REGION=${AWS_REGION:-ap-southeast-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    ports:
      - "5002:5002"
    networks:
      - mfulearnai-network
    restart: unless-stopped

  bedrock-embedding:
    build:
      context: ../../services/bedrock-embedding
      dockerfile: Dockerfile
    container_name: bedrock-embedding
    environment:
      - PORT=5003
      - AWS_REGION=${AWS_REGION:-ap-southeast-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    ports:
      - "5003:5003"
    networks:
      - mfulearnai-network
    restart: unless-stopped

  logger-service:
    build:
      context: ../../
      dockerfile: services/logger/Dockerfile
    container_name: mfulearnai-logger
    environment:
      - PORT=6000
      - ENV_TYPE=TEST
      - MONGO_URI=mongodb://mongo:27017/mfulearnai-logs
    depends_on:
      - mongo
    networks:
      - mfulearnai-network
    restart: unless-stopped

  knowledge-service:
    build:
      context: ../../
      dockerfile: services/knowledge/Dockerfile
    container_name: mfulearnai-knowledge
    environment:
      - PORT=7000
      - ENV_TYPE=TEST
      - CHROMA_URL=http://chroma:8000
      - BEDROCK_EMBEDDING_URL=http://bedrock-embedding:5003/api/bedrock
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=mfulearnai-knowledge
      - MINIO_USE_SSL=false
    depends_on:
      - chroma
      - bedrock-embedding
      - redis
      - minio
    networks:
      - mfulearnai-network
    restart: unless-stopped

  frontend-service:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: mfulearnai-frontend
    environment:
      - VITE_API_URL=/api
      - VITE_ENV=test
    networks:
      - mfulearnai-network
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    container_name: mfulearnai-chroma
    ports:
      - "8001:8000"
    volumes:
      - mfulearnai-chroma-data:/chroma/chroma
    networks:
      - mfulearnai-network
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: mfulearnai-redis
    ports:
      - "6379:6379"
    volumes:
      - mfulearnai-redis-data:/data
    networks:
      - mfulearnai-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  mongo:
    image: mongo:7.0
    container_name: mfulearnai-mongo
    ports:
      - "27017:27017"
    volumes:
      - mfulearnai-mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=mfulearnai
    networks:
      - mfulearnai-network
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: mfulearnai-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - mfulearnai-minio-data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    networks:
      - mfulearnai-network
    restart: unless-stopped

  create-buckets:
    image: minio/mc
    container_name: mfulearnai-create-buckets
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/mfulearnai-knowledge;
      /usr/bin/mc anonymous set download myminio/mfulearnai-knowledge;
      exit 0;
      "
    networks:
      - mfulearnai-network

volumes:
  mfulearnai-redis-data:
  mfulearnai-mongo-data:
  mfulearnai-chroma-data:
  mfulearnai-minio-data:

networks:
  mfulearnai-network:
    driver: bridge
