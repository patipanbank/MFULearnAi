version: '3.8'

# MFULearnAI - TEST/STAGING Environment
# Purpose: Experimentation, testing, model evaluation

services:
  gateway:
    image: nginx:alpine
    container_name: mfulearnai-gateway
    ports:
      - "80:80"
    volumes:
      - ../gateway/nginx-mfulearnai.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-service
      - frontend-service
    networks:
      - mfulearnai-network
    restart: unless-stopped

  backend-service:
    build:
      context: ../../
      dockerfile: backend/Dockerfile
    container_name: mfulearnai-backend
    environment:
      - MCP_CCTV_URL=https://cctvmap.mfu.ac.th/mcp
      - PORT=8080
      - ENV_TYPE=TEST
      - MONGO_URI=mongodb://mongo:27017/mfulearnai-chat
      - MONGO_URI_LOGS=mongodb://mongo:27017/mfulearnai-logs
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-test-jwt-secret-change-me}
      - JWT_PRIVATE_KEY_PATH=/run/secrets/jwt_private_key
      - JWT_PUBLIC_KEY_PATH=/run/secrets/jwt_public_key
      # Auth
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-internal-secret-key}
      # SAML
      - SAML_SP_ENTITY_ID=${SAML_SP_ENTITY_ID:-mfu-learn-ai}
      - SAML_IDP_SSO_URL=${SAML_IDP_SSO_URL:-https://idp.mfu.ac.th/sso}
      - SAML_CERTIFICATE=${SAML_CERTIFICATE}
      # OAuth
      - MFU_SSO_CLIENT_ID=${MFU_SSO_CLIENT_ID}
      - MFU_SSO_CLIENT_SECRET=${MFU_SSO_CLIENT_SECRET}
      - MFU_SSO_AUTH_URL=${MFU_SSO_AUTH_URL}
      - MFU_SSO_TOKEN_URL=${MFU_SSO_TOKEN_URL}
      # AWS Bedrock
      - AWS_REGION=${AWS_REGION:-ap-southeast-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      # Chroma & MinIO
      - CHROMA_URL=http://chroma:8000
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=mfulearnai-knowledge
      - MINIO_USE_SSL=false
      # Observability
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=backend
      # Token Quota (optional overrides — defaults in config/quotas.ts)
      # - DAILY_TOKEN_LIMIT=50000
      # - DAILY_TOKEN_WARNING=0.8
      # - DAILY_TOKEN_HARD_LIMIT=false
    secrets:
      - jwt_private_key
      - jwt_public_key
    depends_on:
      - redis
      - mongo
      - chroma
      - minio
    networks:
      - mfulearnai-network
    restart: unless-stopped

  frontend-service:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: mfulearnai-frontend
    environment:
      - VITE_API_URL=/api
      - VITE_ENV=test
    networks:
      - mfulearnai-network
    restart: unless-stopped

  ocr-service:
    build:
      context: ../../services/ocr
      dockerfile: Dockerfile
    container_name: mfulearnai-ocr
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    ports:
      - "5000:5000"
    networks:
      - mfulearnai-network
    restart: always

  ocr-worker:
    build:
      context: ../../services/ocr-worker
      dockerfile: Dockerfile
    container_name: mfulearnai-ocr-worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - mfulearnai-network
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    container_name: mfulearnai-chroma
    ports:
      - "8001:8000"
    volumes:
      - mfulearnai-chroma-data:/chroma/chroma
    networks:
      - mfulearnai-network
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: mfulearnai-redis
    ports:
      - "6379:6379"
    volumes:
      - mfulearnai-redis-data:/data
    networks:
      - mfulearnai-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  mongo:
    image: mongo:7.0
    container_name: mfulearnai-mongo
    ports:
      - "27017:27017"
    volumes:
      - mfulearnai-mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=mfulearnai
    networks:
      - mfulearnai-network
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: mfulearnai-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - mfulearnai-minio-data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    networks:
      - mfulearnai-network
    restart: unless-stopped

  create-buckets:
    image: minio/mc
    container_name: mfulearnai-create-buckets
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c " /usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin; /usr/bin/mc mb myminio/mfulearnai-knowledge; /usr/bin/mc anonymous set download myminio/mfulearnai-knowledge; exit 0; "
    networks:
      - mfulearnai-network

  # --- Observability Stack ---
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: mfulearnai-otel
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8888:8888" # Metrics
    networks:
      - mfulearnai-network

  prometheus:
    image: prom/prometheus:latest
    container_name: mfulearnai-prometheus
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - mfulearnai-network

  grafana:
    image: grafana/grafana:latest
    container_name: mfulearnai-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - mfulearnai-network

secrets:
  jwt_private_key:
    file: ./secrets/jwt/jwt-private.pem
  jwt_public_key:
    file: ./secrets/jwt/jwt-public.pem

volumes:
  mfulearnai-redis-data:
  mfulearnai-mongo-data:
  mfulearnai-chroma-data:
  mfulearnai-minio-data:


networks:
  mfulearnai-network:
    driver: bridge
