server {
    listen 80;
    server_name mfulearnai.mfu.ac.th;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mfulearnai.mfu.ac.th;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/mfulearnai.mfu.ac.th/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mfulearnai.mfu.ac.th/privkey.pem;

    # SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Proxy to Kubernetes Ingress NodePort
    # Changed from localhost:3000 (Docker Compose) to localhost:31530 (Kubernetes)
    location / {
        proxy_pass http://localhost:31530;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Logging
    access_log /var/log/nginx/mfulearnai_access.log;
    error_log /var/log/nginx/mfulearnai_error.log;
}
