user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Upstream for Docker Compose Frontend
    upstream frontend {
        server frontend:80;
    }

    # Upstream for Kubernetes Ingress (HTTP port)
    upstream kubernetes {
        server localhost:8080;
    }

    upstream minio {
        server minio:9000;
    }

    # Map to handle WebSocket upgrade properly
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Determine the real scheme from the upstream proxy
    map $http_x_forwarded_proto $real_scheme {
        default $scheme;
        "https," $http_x_forwarded_proto;
    }

    server {
        listen 80;
        client_max_body_size 100M;
        server_name mfulearnai.mfu.ac.th localhost;

        # Add logging for debugging
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log debug;

        # ===========================================
        # Kubernetes Microservices (via Ingress)
        # ===========================================

        # WebSocket to Kubernetes
        location /ws {
            proxy_pass http://kubernetes;

            # Essential WebSocket headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;

            # WebSocket specific timeouts
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;

            # Disable buffering
            proxy_buffering off;
            proxy_cache off;
        }

        # All API routes go to Kubernetes microservices
        location /api/ {
            proxy_pass http://kubernetes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_read_timeout 3600s;
            proxy_connect_timeout 3600s;
            proxy_send_timeout 3600s;

            # Handle CORS
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }

        # ===========================================
        # Docker Compose Services
        # ===========================================

        # MinIO Object Storage
        location /minio/ {
            proxy_pass http://minio/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;

            client_max_body_size 100M;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
        }

        # ===========================================
        # Frontend (Docker Compose) - Catch All
        # ===========================================

        # Static frontend from Docker Compose
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
        }
    }
}
