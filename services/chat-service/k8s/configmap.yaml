apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-service-config
  namespace: mfulearnai
  labels:
    app: chat-service
data:
  # Application environment
  NODE_ENV: "production"
  APP_ENV: "production"
  LOG_LEVEL: "info"

  # Server configuration
  PORT: "5002"

  # AWS configuration
  AWS_REGION: "us-east-1"
  BEDROCK_MODEL_ID: "anthropic.claude-3-5-sonnet-20240620-v1:0"

  # Service URLs
  AUTH_SERVICE_URL: "http://auth-service:5001"
  AGENT_SERVICE_URL: "http://agent-service:5003"
  RAG_SERVICE_URL: "http://rag-service:5004"

  # CORS configuration
  CORS_ORIGIN: "https://mfulearnai.mfu.ac.th,http://localhost:8080"

  # Agent configuration
  MAX_ITERATIONS: "10"
  MAX_CONCURRENT_CHATS: "100"
  CHECKPOINT_TYPE: "redis"
  ENABLE_STREAMING: "true"
  ENABLE_METRICS: "true"

  # Model configuration
  TEMPERATURE: "0.7"
  MAX_TOKENS: "4096"
